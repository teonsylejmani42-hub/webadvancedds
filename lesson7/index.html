<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Information: </legend>
            <label for="firstname">First Name: </label><br>
            <input type="text" id="firstname" name="firstname" value="John" readonly><br><br>
            <label for="lastname">Last Name:</label><br>
            <input type="text" id="lastname" name="lastname" value="Smith" disabled><br>
            <label for="email">Email: </label><br><br>
            <input type="email" id="email" name="email" required><br><br>
            <label for="password">Password: </label><br>
            <input type="password" id="password" name="password" size="40" placeholder="Password"><br><br>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male:</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female:</label><br>
            <label>Hobbies:</label><br><br>
            <input type="checkbox" id="gaming" name="gaming"  value="Gaming">
            <label for="gaming">Gaming</label><br>
            <input type="checkbox" id="football" name="football" value="Football">
            <label for="football">Football</label><br>
            <input type="checkbox" id="swimming" name="swimming" value="Swimming">
            <label for="football">Swimming</label><br>
            <br>
            <select id="pet" name="pet">
                <option value="Dog">Dog</option>
                <option value="Cat">Cat</option>
                <option value="Parrot">Parrot</option>
            </select><br><br>
            <input type="submit" id="submit" name="submit"><br>
        </fieldset>
    </form>

</body>
</html>
